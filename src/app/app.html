<main class="container">
  <header>
    <h1>Sky Spotter</h1>
    <p>Monitorização de Anomalias SPHEREx</p>
  </header>

  <div class="card">
    <!-- Área da Imagem (Clicável no modo anotação) -->
    <div class="image-container" 
         [class.cursor-crosshair]="isAnnotationMode"
         (click)="handleImageClick($event)">
      
      <img [src]="currentImageUrl" alt="Corte do céu SPHEREx" />
      
      <div class="badge">
        Passagem: {{ activeEpoch === 'A' ? 'Mês 01' : 'Mês 06' }}
      </div>

      <!-- Marcador Visual inserido pelo utilizador -->
      <div *ngIf="marker" 
           class="marker" 
           [style.left.%]="marker.x" 
           [style.top.%]="marker.y">
      </div>
    </div>

    <div class="controls-area">
      <!-- MODO NORMAL: Dois botões de decisão -->
      <div class="decision-buttons" *ngIf="!isAnnotationMode">
        <button class="btn-skip" (click)="markNothing()">❌ Nada mudou</button>
        <button class="btn-found" (click)="startAnnotation()">☄️ Achei algo!</button>
      </div>

      <!-- MODO DE ANOTAÇÃO: Instruções e Categorias -->
      <div class="annotation-panel" *ngIf="isAnnotationMode">
        <div class="instruction" *ngIf="!marker">
          👆 Clique na imagem exatamente onde viu a alteração.
        </div>

        <div class="form-area" *ngIf="marker">
          <p>O que aconteceu neste ponto?</p>
          <div class="category-grid">
            <button [class.active]="selectedCategory === 'Movimento'" (click)="setCategory('Movimento')">Movimento</button>
            <button [class.active]="selectedCategory === 'Brilho'" (click)="setCategory('Brilho')">Brilho</button>
            <button [class.active]="selectedCategory === 'Ruído'" (click)="setCategory('Ruído')">Ruído</button>
          </div>
          
          <div class="form-actions">
            <button class="btn-cancel" (click)="resetAndNext()">Cancelar</button>
            <button class="btn-submit" [disabled]="!selectedCategory" (click)="submitAnnotation()">Enviar Marcação</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
