<div class="app-wrapper">
  <header class="global-header">
    <div class="brand" (click)="navigateTo('welcome')">☄️ Sky Spotter</div>
    <nav class="nav-links">
      <a [class.active]="currentScreen === 'welcome'" (click)="navigateTo('welcome')">Visão Geral</a>
      <a [class.active]="currentScreen === 'blink'" (click)="navigateTo('blink')">Observatório</a>
      <a [class.active]="currentScreen === 'data'" (click)="navigateTo('data')">Base de Inteligência</a>
    </nav>
  </header>

  <main class="content-area">
    <section *ngIf="currentScreen === 'welcome'">
      <h1>O Cosmos, Mapeado por Si.</h1>
      <button (click)="navigateTo('blink')">Iniciar Varredura</button>
    </section>

    <section class="observatory-screen" *ngIf="currentScreen === 'blink'">
      <h2>Terminal do Observatório</h2>
      <div class="image-container">
        <img [src]="currentImageUrl" alt="Corte do céu NASA" />
        <div class="badge-epoch">
          Filtro Ativo: <strong>{{ activeEpoch === 'A' ? 'Época 01 (Mês 01)' : 'Época 02 (Mês 06)' }}</strong>
        </div>
      </div>
      <div class="controls-area">
        <button (click)="markNothing()">⏭️ Estático / Sem Alterações</button>
      </div>
    </section>

    <section *ngIf="currentScreen === 'data'">
      <h2>Base de Inteligência Coletiva</h2>
    </section>
  </main>
</div>
